<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三种 kind 的分色与形状 — 真实渲染验证</title>
<style>
  html, body { margin: 0; background: #0d1117; color: #e6edf3; font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #result { position: fixed; left: 8px; top: 8px; z-index: 99; font-weight: 700; padding: 6px 10px; border-radius: 6px; background: #161b22; font-size: 15px; }
  .ok { color: #3fb950; }
  .bad { color: #f85149; }
  #log { position: fixed; right: 8px; top: 8px; width: 520px; max-height: 92vh; overflow: auto;
         background: #161b22; padding: 8px; border-radius: 6px; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
  #stage { width: 760px; height: 420px; margin-top: 44px; border: 1px solid #30363d; }
  /* ⚠️ 测试页必须让插件根元素**撑满** #stage —— 插件的 CSS 是 height:100%，
     而 canvas 又是 height:100%。真实 DSH 里由布局保证；
     测试页不写这条，canvas 就会停在 HTML 默认的 300×150。
     （本鲸就是被这个坑了好几轮：canvas 300×150 却被当成插件的 bug。） */
  #stage > .dsh-am-root { height: 100%; }
</style>
</head>
<body>
<div id="result">running…</div>
<div id="stage"></div>
<pre id="log"></pre>
<script>
  const lines = []
  const log = (s) => { lines.push(s); document.getElementById('log').textContent = lines.join('\n') }
  const done = (ok, msg) => {
    document.getElementById('result').innerHTML = '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✅ ' : '❌ ') + msg + '</span>'
    document.title = ok ? 'PASS' : 'FAIL'
  }

  /** 极简但**语义正确**的 React：每个函数组件独立 hook 上下文 + DOM 复用。 */
  function makeReact() {
    const states = new Map()
    let path = []
    let hookCursor = 0
    let pendingEffects = []
    let rerender = null

    const R = {
      createElement(type, props, ...children) {
        return { type, props: props ?? {}, children: children.flat().filter((c) => c != null && c !== false && c !== true) }
      },
      useRef(init) { const k = path.join('/') + '#h' + hookIndex(); if (!states.has(k)) states.set(k, { current: init }); return states.get(k) },
      useState(init) {
        const k = path.join('/') + '#h' + hookIndex()
        if (!states.has(k)) states.set(k, typeof init === 'function' ? init() : init)
        return [states.get(k), (v) => { states.set(k, typeof v === 'function' ? v(states.get(k)) : v); schedule() }]
      },
      useEffect(fn, deps) {
        const k = path.join('/') + '#h' + hookIndex()
        const prev = states.get(k + ':d')
        const changed = prev === undefined || deps === undefined || deps.some((d, i) => d !== prev[i])
        states.set(k + ':d', deps)
        if (changed) pendingEffects.push(fn)
      },
      useMemo(fn) { hookIndex(); return fn() },
    }
    function hookIndex() { return hookCursor++ }
    let scheduled = false
    function schedule() { if (scheduled) return; scheduled = true; setTimeout(() => { scheduled = false; rerender?.() }, 0) }

    function build(node, p) {
      if (node == null || node === false) return document.createTextNode('')
      if (typeof node === 'string' || typeof node === 'number') return document.createTextNode(String(node))
      if (Array.isArray(node)) { const f = document.createDocumentFragment(); node.forEach((c, i) => f.appendChild(build(c, p.concat('[' + i + ']')))); return f }
      if (typeof node.type === 'function') {
        const my = p.concat(node.type.name || 'anon')
        const sp = path; const sc = hookCursor
        path = my; hookCursor = 0
        const out = build(node.type(node.props), my)
        path = sp; hookCursor = sc
        return out
      }
      const el = document.createElement(node.type)
      for (const [k, v] of Object.entries(node.props ?? {})) {
        if (v == null || v === false) continue
        if (k === 'ref') { if (typeof v === 'object') v.current = el; continue }
        if (k === 'style' && typeof v === 'object') { Object.assign(el.style, v); continue }
        if (k === 'className') { el.className = v; continue }
        if (k.startsWith('on') && typeof v === 'function') { el.addEventListener(k.slice(2).toLowerCase(), v); continue }
        if (typeof v === 'object') continue
        el.setAttribute(k, String(v))
      }
      ;(node.children ?? []).forEach((c, i) => el.appendChild(build(c, p.concat('[' + i + ']'))))
      return el
    }

    R.__mount = (component, props, container) => {
      const render = () => {
        pendingEffects = []
        const fresh = build({ type: component, props, children: [] }, [])
        const live = container.firstChild
        if (live && live.nodeType === fresh.nodeType && live.nodeName === fresh.nodeName) patch(live, fresh)
        else { container.innerHTML = ''; container.appendChild(fresh) }
        for (const fn of pendingEffects) fn()
      }
      rerender = render
      render()
    }

    function patch(live, fresh) {
      if (live.nodeType === 3) { if (live.nodeValue !== fresh.nodeValue) live.nodeValue = fresh.nodeValue; return }
      if (live.nodeType !== 1) return
      for (const a of [...live.attributes]) if (!fresh.hasAttribute(a.name)) live.removeAttribute(a.name)
      for (const a of [...fresh.attributes]) if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value)
      const lk = [...live.childNodes]; const fk = [...fresh.childNodes]
      for (let i = 0; i < Math.max(lk.length, fk.length); i += 1) {
        const l = lk[i]; const f = fk[i]
        if (l === undefined && f !== undefined) live.appendChild(f)
        else if (l !== undefined && f === undefined) l.remove()
        else if (l.nodeType === f.nodeType && l.nodeName === f.nodeName) patch(l, f)
        else live.replaceChild(f, l)
      }
    }
    return R
  }

  /** 假快照：三种 kind 各一个，颜色应当明显不同。 */
  const SNAPSHOT = {
    ok: true, truncated: false,
    nodes: [
      { id: 'j1', label: '判断：端口该是 8080', kind: 'judgment', status: 'active', degree: 2, createdAt: 3, revision: 1 },
      { id: 'i1', label: '思考：也许问题不在端口', kind: 'insight', status: 'active', degree: 1, createdAt: 2, revision: 1 },
      { id: 'r1', label: '规矩：只写判断，不写事实', kind: 'rule', status: 'active', degree: 1, createdAt: 1, revision: 1 },
    ],
    edges: [
      { from: 'j1', to: 'i1', type: 'complements' },
      { from: 'j1', to: 'r1', type: 'depends' },
    ],
    stats: { nodes: 3, edges: 2, active: 3, retired: 0, judgments: 1, rules: 1, insights: 1, orphans: 0, problems: 0 },
  }
  window.fetch = async (url) => {
    const u = String(url)
    if (u.includes('/snapshot')) return { ok: true, status: 200, json: async () => SNAPSHOT }
    if (u.includes('/node')) return { ok: true, status: 200, json: async () => ({ ok: true, node: { id: 'j1', text: '全文', kind: 'judgment', status: 'active', revision: 1, createdAt: 3, chain: [] } }) }
    return { ok: false, status: 404, json: async () => ({}) }
  }

  window.__ModuleLoader__ = {
    load({ factory }) {
      const React = makeReact()
      const api = factory((n) => { if (n === 'react') return React; throw new Error('require ' + n) })
      log('factory OK')
      const reg = []
      api.apply({ slots: { inject: (_s, cb) => cb(), register: (o, c) => reg.push({ o, c }) } })
      const main = reg.find((r) => r.o.name === 'main')
      React.__mount(main.c, {}, document.getElementById('stage'))
      log('面板已挂载')
    },
  }

  window.addEventListener('load', () => {
    const s = document.createElement('script')
    s.src = 'client.js?rev=' + Date.now()
    s.onerror = () => done(false, 'client.js 加载失败')
    document.head.appendChild(s)

    let waited = 0
    const poll = setInterval(() => {
      waited += 150
      const canvas = document.querySelector('#stage canvas')
      if (canvas === null) { if (waited >= 8000) { clearInterval(poll); done(false, '没有 canvas') } ; return }
      clearInterval(poll)
      setTimeout(() => runChecks(canvas), 900)
    }, 150)
  })

  function runChecks(canvas) {
    const results = []
    const check = (name, ok, detail) => { results.push({ name, ok }); log((ok ? '  ✓ ' : '  ✗ ') + name + (detail ? ' — ' + detail : '')) }

    // ---- 先把几何打出来（排查"画布太小/视野不对"最直接） ----
    const rect = canvas.getBoundingClientRect()
    log('  canvas.width/height = ' + canvas.width + '×' + canvas.height)
    log('  CSS 尺寸            = ' + rect.width.toFixed(0) + '×' + rect.height.toFixed(0))
    log('  dpr                 = ' + window.devicePixelRatio)
    const stage = document.getElementById('stage')
    log('  #stage 尺寸         = ' + stage.getBoundingClientRect().width.toFixed(0) + '×' + stage.getBoundingClientRect().height.toFixed(0))
    log('  .dsh-am-stage 尺寸  = ' + (document.querySelector('.dsh-am-stage')?.getBoundingClientRect().height.toFixed(0) ?? 'n/a'))
    log('')

    const ctx = canvas.getContext('2d')
    const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data

    /** 收集画面上的主要颜色（按出现次数）。 */
    const counts = new Map()
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 40) continue
      // 量化到 32 一档，避免抗锯齿噪点
      const key = [d[i], d[i + 1], d[i + 2]].map((v) => Math.round(v / 32) * 32).join(',')
      counts.set(key, (counts.get(key) || 0) + 1)
    }
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1])
    log('  画面主要颜色（量化后）：')
    for (const [k, v] of top.slice(0, 6)) log('    ' + k + ' × ' + v)

    const painted = [...counts.values()].reduce((a, b) => a + b, 0)
    check('画布有内容', painted > 1000, painted + ' 像素')

    /**
     * 判断某个颜色（近似）在画面上存在。
     * @param {number[]} rgb - 目标 RGB。
     * @param {number} tol - 容差。
     * @returns {boolean} 是否存在。
     */
    function hasColor(rgb, tol) {
      for (const [k, v] of counts) {
        if (v < 15) continue
        const c = k.split(',').map(Number)
        if (Math.abs(c[0] - rgb[0]) <= tol && Math.abs(c[1] - rgb[1]) <= tol && Math.abs(c[2] - rgb[2]) <= tol) return true
      }
      return false
    }

    // 三种 kind 的 fallback 色（主题变量缺失时用它们）
    check('判断的蓝在画面上', hasColor([77, 155, 255], 48), '#4d9bff')
    check('思考的青在画面上', hasColor([34, 193, 168], 48), '#22c1a8')
    check('规矩的琥珀在画面上', hasColor([224, 160, 58], 48), '#e0a03a')

    // 三种颜色必须**互相分得开**（量化后不该是同一个桶）
    const distinct = new Set(
      top.filter(([, v]) => v > 15).map(([k]) => k),
    )
    check('画面至少有 3 种明显不同的实色', distinct.size >= 3, distinct.size + ' 种')

    const failed = results.filter((r) => !r.ok)

    // 把结论**压成一行**写进标题与 result 元素 —— 这样用无障碍文本抓取也能读到
    // （截图会缩放到看不清小字，文本不会）。
    const verdict = [
      `painted=${painted}`,
      `canvas=${canvas.width}x${canvas.height}`,
      `css=${Math.round(rect.width)}x${Math.round(rect.height)}`,
      `ok=${failed.length === 0}`,
      failed.length === 0 ? 'ALL_PASS' : 'FAIL:' + failed.map((f) => f.name).join('|'),
    ].join(' ')
    document.title = 'AMRESULT ' + verdict
    const big = document.createElement('div')
    big.id = 'verdict'
    big.style.cssText = 'position:fixed;left:8px;top:8px;z-index:999;background:#000;color:#0f0;font:700 22px Consolas,monospace;padding:10px;white-space:pre-wrap;max-width:1080px;'
    big.textContent = 'VERDICT ' + verdict
    document.body.appendChild(big)

    done(failed.length === 0, failed.length === 0
      ? '三种 kind 的颜色都能分辨'
      : failed.length + ' 项失败：' + failed.map((f) => f.name).join('、'))
  }
</script>
</body>
</html>
