# Self-insertion layer for the dsh-ai-memory bundle.
#
# This row is what gets the plugin loaded. The memory store defaults to
# ~/.dsh/ai-memory/; to relocate it, override config.dir for the same id in the
# profile's own cordis.patch.yml (per spec, the user patch layer is applied
# after the bundle layer and survives upgrades).
- insert:
    - id: dsh-ai-memory
      name: dsh-ai-memory
      config:
        enabled: true
        injectIndex: true
        maxIndexEntries: 40
        maxGraphNodes: 500
