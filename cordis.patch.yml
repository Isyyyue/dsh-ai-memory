# dsh-ai-memory 的 bundle 自插入层。
#
# 这一行让插件被加载。记忆库目录默认在 ~/.dsh/ai-memory/，
# 想换位置就在 profile 的 cordis.patch.yml 里覆盖同一 id 的 config.dir
# （官方规范：用户补丁层在 bundle 层之后应用，且能跨升级存活）。
- insert:
    - id: dsh-ai-memory
      name: dsh-ai-memory
      config:
        enabled: true
        injectIndex: true
        maxIndexEntries: 40
        maxGraphNodes: 500
